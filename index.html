<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fahrzeugakte — Offline</title>
<style>
  :root {
    --graphite: #1B1D1F;
    --surface: #232628;
    --surface2: #2C3033;
    --border: #3A3E42;
    --border-soft: #2E3235;
    --paper: #EDEAE2;
    --muted: #8E9295;
    --muted-dim: #5A5D60;
    --blue: #0B4EA2;
    --warn: #E8622C;
    --danger: #C43E3E;
    --ok: #4C8C5B;
    --font-display: "Arial Narrow", "Helvetica Neue Condensed", Arial, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--graphite); }
  body {
    font-family: var(--font-body);
    color: var(--paper);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-mark {
    width: 34px; height: 24px; background: var(--blue); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark span { color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 11px; }
  .brand-title {
    font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--paper);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  h2 { margin: 0; }
  .section-label {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .btn {
    border: none; border-radius: 9px; padding: 11px 16px; font-family: var(--font-body);
    font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-ghost { background: var(--surface2); color: var(--paper); }
  .btn-danger { background: #3A2323; color: #E8837A; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 8px 10px; font-size: 12px; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; display: flex; padding: 4px; }

  /* upcoming list */
  .upcoming-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--surface); border-radius: 10px; margin-bottom: 6px; cursor: pointer;
  }
  .upcoming-item .label { flex: 1; font-size: 13px; color: var(--paper); }
  .upcoming-item .date { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  /* filter chips */
  .chip-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
  .chip {
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-family: var(--font-body);
    font-weight: 600; cursor: pointer; white-space: nowrap; background: var(--surface);
    border: 1px solid var(--border-soft); color: var(--muted);
  }
  .chip.active { color: var(--paper); }

  /* vehicle card */
  .vcard {
    background: var(--surface); border-radius: 14px; padding: 16px; cursor: pointer;
    border: 1px solid var(--border-soft); display: flex; gap: 14px; align-items: center;
    margin-bottom: 10px;
  }
  .vcard-name {
    font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--paper);
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .vcard-sub {
    font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 2px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .plate-tag {
    border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; color: var(--paper);
    background: rgba(11,78,162,0.13);
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--font-mono);
    letter-spacing: 0.3px; border-radius: 999px; padding: 3px 9px; text-transform: uppercase;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .type-badge-tag {
    font-family: var(--font-mono); font-size: 11px; border-radius: 999px; padding: 3px 9px; text-transform: uppercase;
  }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }

  /* type badge / icon tile */
  .type-tile {
    border-radius: 10px; flex-shrink: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .type-tile .code { font-family: var(--font-mono); letter-spacing: 0.5px; }

  /* tabs */
  .tab-row { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
  .tab {
    background: var(--surface); color: var(--muted); border: none; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; font-family: var(--font-body); font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .tab.active { background: var(--blue); color: #fff; }

  /* detail header */
  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .detail-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--paper); text-transform: uppercase; }
  .detail-sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  /* generic card */
  .card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-box { flex: 1; background: var(--surface); border-radius: 12px; padding: 14px; }
  .stat-box .label { font-size: 11px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; }
  .stat-box .value { font-family: var(--font-display); font-size: 22px; color: var(--paper); font-weight: 700; }

  .bar-row { margin-bottom: 10px; }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--paper); margin-bottom: 4px; }
  .bar-row .top .amt { font-family: var(--font-mono); }
  .bar-track { height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; }

  .kv-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--surface2); font-size: 13px; }
  .kv-row .k { color: var(--muted); }
  .kv-row .v { color: var(--paper); font-family: var(--font-mono); }
  .kv-row:last-child { border-bottom: none; }

  .termin-item { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .termin-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .termin-label { color: var(--paper); font-size: 14px; font-weight: 600; }
  .termin-date { color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
  .termin-note { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .list-item {
    background: var(--surface); border-radius: 10px; padding: 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .list-item .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .list-item .main { flex: 1; min-width: 0; }
  .list-item .title { color: var(--paper); font-size: 13px; }
  .list-item .sub { color: var(--muted); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
  .list-item .amt { color: var(--paper); font-family: var(--font-mono); font-size: 13px; }
  .werk-item { background: var(--surface); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .werk-item .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .werk-item .desc { color: var(--paper); font-size: 13px; font-weight: 600; }
  .werk-item .meta { color: var(--muted); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
  .werk-item .amt { color: var(--paper); font-family: var(--font-mono); font-size: 13px; margin-top: 4px; }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,11,12,0.72); display: flex; align-items: flex-end;
    justify-content: center; z-index: 50; backdrop-filter: blur(2px);
  }
  .modal-box {
    background: var(--surface); width: 100%; max-width: 440px; border-radius: 18px 18px 0 0;
    padding: 20px 20px 28px; max-height: 88vh; overflow-y: auto; border-top: 3px solid var(--blue);
  }
  .modal-box.wide { max-width: 560px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h2 {
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.5px;
    color: var(--paper); text-transform: uppercase;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input, .field select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--paper); font-size: 14px; font-family: var(--font-body); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--blue); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .form-divider { border-top: 1px solid var(--border); margin: 16px 0; padding-top: 14px; }
  .form-divider .heading { font-family: var(--font-mono); font-size: 11px; color: var(--blue); text-transform: uppercase; margin-bottom: 10px; }
  .form-actions { display: flex; gap: 10px; margin-top: 8px; }
  .form-actions .btn { flex: 1; }

  .type-chip-row { display: flex; gap: 8px; }
  .type-chip {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px;
    border-radius: 10px; cursor: pointer; background: var(--surface2); border: 1.5px solid var(--border);
  }
  .type-chip span { font-size: 11px; color: var(--muted); font-family: var(--font-body); font-weight: 600; }
  .type-chip svg { color: var(--muted); }
  .type-chip.active span { color: var(--paper); }

  .footer-actions { display: flex; gap: 10px; margin-top: 28px; }
  .footer-note { font-size: 11px; color: var(--muted-dim); margin-top: 10px; line-height: 1.5; }

  .loading-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  button:focus-visible, input:focus-visible, select:focus-visible, .vcard:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Lade Fahrzeugakte…</div></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none">

<script>
(function () {
  "use strict";

  /* ================= DB LAYER (IndexedDB) ================= */
  const DB_NAME = "fahrzeugakte-db";
  const DB_VERSION = 1;
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("vehicles")) {
          db.createObjectStore("vehicles", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("costs")) {
          const s = db.createObjectStore("costs", { keyPath: "id" });
          s.createIndex("vehicleId", "vehicleId");
        }
        if (!db.objectStoreNames.contains("werkstatt")) {
          const s = db.createObjectStore("werkstatt", { keyPath: "id" });
          s.createIndex("vehicleId", "vehicleId");
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbGetAll(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, "readonly");
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPut(store, obj) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, "readwrite");
      tx.objectStore(store).put(obj);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDelete(store, id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, "readwrite");
      tx.objectStore(store).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDeleteByIndex(store, indexName, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, "readwrite");
      const idx = tx.objectStore(store).index(indexName);
      const req = idx.openCursor(IDBKeyRange.only(value));
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) { cursor.delete(); cursor.continue(); }
      };
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbClearAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(["vehicles", "costs", "werkstatt"], "readwrite");
      tx.objectStore("vehicles").clear();
      tx.objectStore("costs").clear();
      tx.objectStore("werkstatt").clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ================= HELPERS ================= */
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  function fmtDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function fmtEUR(n) {
    return (Number(n) || 0).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
  }
  function daysUntil(iso) {
    if (!iso) return null;
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return null;
    return Math.round((d - now) / 86400000);
  }
  function statusFor(iso, soonThreshold) {
    soonThreshold = soonThreshold == null ? 60 : soonThreshold;
    const d = daysUntil(iso);
    if (d === null) return "none";
    if (d < 0) return "overdue";
    if (d <= soonThreshold) return "soon";
    return "ok";
  }
  const STATUS_COLOR = { overdue: "#C43E3E", soon: "#E8622C", ok: "#4C8C5B", none: "#5A5D60" };
  const STATUS_LABEL = { overdue: "überfällig", soon: "bald fällig", ok: "in Ordnung", none: "kein Termin" };

  const CATS = ["Sprit", "Werkstatt", "Versicherung", "Steuer", "Verschleißteile", "Sonstiges"];
  const CAT_COLOR = {
    Sprit: "#E8622C", Werkstatt: "#0B4EA2", Versicherung: "#8E9295",
    Steuer: "#C43E3E", Verschleißteile: "#4C8C5B", Sonstiges: "#9A6B4C"
  };

  const TYPE_META = {
    Auto: { label: "Auto", code: "PKW", color: "#0B4EA2", hasTuv: true },
    Motorrad: { label: "Motorrad", code: "KRAD", color: "#E8622C", hasTuv: true },
    eMoto: { label: "E-Moto", code: "L1e", color: "#4C8C5B", hasTuv: false },
    Fahrrad: { label: "Fahrrad", code: "RAD", color: "#9A6B4C", hasTuv: false }
  };
  const TYPE_ORDER = ["Auto", "Motorrad", "eMoto", "Fahrrad"];

  /* ================= ICONS (inline SVG, no deps) ================= */
  function icon(name, opts) {
    opts = opts || {};
    const size = opts.size || 18;
    const color = opts.color || "currentColor";
    const common = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
    const paths = {
      car: '<path d="M5 17h14M5 17a2 2 0 1 0 0 .1M19 17a2 2 0 1 0 0 .1M3 17V11l2-5h14l2 5v6M3 11h18"/>',
      bike: '<circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-9h4l4 9M9 8h4M12 17l2-6"/>',
      zap: '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>',
      moto: '<circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M7.5 17.5h5l2-6h3.5"/><path d="M9 11.5h4l1.5 2"/><path d="M12.5 11.5 11 8h-2"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      chevronLeft: '<path d="M15 18l-6-6 6-6"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
      alertTriangle: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
      shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/>',
      fileText: '<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 13h6M9 17h6M9 9h2"/>',
      receipt: '<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2Z"/><path d="M8 8h8M8 12h8"/>',
      download: '<path d="M12 3v12M6 11l6 6 6-6M4 21h16"/>',
      upload: '<path d="M12 21V9M6 13l6-6 6 6M4 3h16"/>',
      edit: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="M15 5l4 4"/>'
    };
    return `<svg ${common}>${paths[name] || ""}</svg>`;
  }
  function typeIcon(type, opts) {
    if (type === "Motorrad") return icon("moto", opts);
    if (type === "eMoto") return icon("zap", opts);
    if (type === "Fahrrad") return icon("bike", opts);
    return icon("car", opts);
  }

  function plaketteSVG(date, size) {
    size = size || 64;
    const status = statusFor(date, 60);
    const color = STATUS_COLOR[status];
    const d = date ? new Date(date + "T00:00:00") : null;
    const month = d && !isNaN(d) ? d.getMonth() + 1 : null;
    const year = d && !isNaN(d) ? String(d.getFullYear()).slice(-2) : "––";
    let ticks = "";
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const isMonth = i + 1 === month;
      const x1 = 50 + Math.cos(angle) * 39, y1 = 50 + Math.sin(angle) * 39;
      const r2 = isMonth ? 30 : 34;
      const x2 = 50 + Math.cos(angle) * r2, y2 = 50 + Math.sin(angle) * r2;
      ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1B1D1F" stroke-width="${isMonth ? 3 : 1.2}" opacity="${isMonth ? 0.85 : 0.35}"/>`;
    }
    return `<div style="width:${size}px;height:${size}px;flex-shrink:0;">
      <svg width="${size}" height="${size}" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="${color}" opacity="0.16"/>
        <circle cx="50" cy="50" r="44" fill="${color}"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="#1B1D1F" stroke-width="1.5" opacity="0.25"/>
        ${ticks}
        <text x="50" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1B1D1F" font-family="Arial Narrow, sans-serif">${year}</text>
        <text x="50" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1D1F" font-family="Arial Narrow, sans-serif" opacity="0.75">${month ? "MON. " + month : "OFFEN"}</text>
      </svg>
    </div>`;
  }

  function typeBadge(type, size) {
    size = size || 42;
    const meta = TYPE_META[type] || TYPE_META.Auto;
    return `<div class="type-tile" style="width:${size}px;height:${size}px;background:${meta.color}1F;border:1.5px solid ${meta.color}66;">
      ${typeIcon(type, { size: Math.round(size * 0.4), color: meta.color })}
      <span class="code" style="font-size:${Math.round(size * 0.17)}px;color:${meta.color};">${meta.code}</span>
    </div>`;
  }

  function statusPill(status) {
    const color = STATUS_COLOR[status];
    return `<span class="status-pill" style="color:${color};border:1px solid ${color}55;background:${color}18;">
      <span class="status-dot" style="background:${color};"></span>${STATUS_LABEL[status]}
    </span>`;
  }

  /* ================= STATE ================= */
  const state = {
    loading: true,
    vehicles: [],
    costs: [],
    werkstatt: [],
    view: "dashboard",
    selectedId: null,
    detailTab: "uebersicht",
    typeFilter: "Alle",
    modal: null,
    editingCostId: null,
    editingWerkstattId: null
  };

  async function loadAll() {
    const [vehicles, costs, werkstatt] = await Promise.all([
      dbGetAll("vehicles"), dbGetAll("costs"), dbGetAll("werkstatt")
    ]);
    state.vehicles = vehicles; state.costs = costs; state.werkstatt = werkstatt;
    state.loading = false;
  }

  /* ================= ACTIONS ================= */
  function goDashboard() { state.view = "dashboard"; state.selectedId = null; render(); }
  function openVehicle(id) { state.view = "detail"; state.selectedId = id; state.detailTab = "uebersicht"; render(); }
  function setTab(tab) { state.detailTab = tab; render(); }
  function setTypeFilter(t) { state.typeFilter = t; render(); }
  function openModal(name, id) {
    state.modal = name;
    if (name === "editCost") state.editingCostId = id;
    if (name === "editWerkstatt") state.editingWerkstattId = id;
    render();
  }
  function closeModal() { state.modal = null; state.editingCostId = null; state.editingWerkstattId = null; render(); }

  async function saveVehicle(data, id) {
    const v = { ...data, id: id || uid() };
    ["km"].forEach(k => { if (v[k] !== undefined) v.km = v.km; });
    await dbPut("vehicles", v);
    await loadAll();
    state.modal = null;
    render();
  }

  async function deleteVehicleConfirm(id) {
    const v = state.vehicles.find(x => x.id === id);
    if (!v) return;
    const ok = confirm(`${v.name || v.brand || "Fahrzeug"} wirklich löschen? Alle Kosten- und Werkstatteinträge gehen mit verloren.`);
    if (!ok) return;
    await dbDelete("vehicles", id);
    await dbDeleteByIndex("costs", "vehicleId", id);
    await dbDeleteByIndex("werkstatt", "vehicleId", id);
    await loadAll();
    state.view = "dashboard"; state.selectedId = null;
    render();
  }

  async function saveCost(data, id) {
    const c = { ...data, id: id || uid(), vehicleId: state.selectedId, amount: Number(data.amount) || 0 };
    await dbPut("costs", c);
    await loadAll();
    state.modal = null; state.editingCostId = null;
    render();
  }
  async function deleteCost(id) {
    await dbDelete("costs", id);
    await loadAll();
    render();
  }
  async function saveWerkstatt(data, id) {
    const w = { ...data, id: id || uid(), vehicleId: state.selectedId, kosten: Number(data.kosten) || 0 };
    await dbPut("werkstatt", w);
    await loadAll();
    state.modal = null; state.editingWerkstattId = null;
    render();
  }
  async function deleteWerkstatt(id) {
    await dbDelete("werkstatt", id);
    await loadAll();
    render();
  }

  async function exportData() {
    const payload = {
      exportedAt: new Date().toISOString(),
      vehicles: state.vehicles, costs: state.costs, werkstatt: state.werkstatt
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fahrzeugakte-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  async function importDataFile(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.vehicles)) throw new Error("Ungültiges Format");
      const mode = confirm(
        "OK = Importierte Daten zu bestehenden hinzufügen.\nAbbrechen = Bestehende Daten zuerst löschen und dann importieren."
      );
      if (!mode) { await dbClearAll(); }
      for (const v of data.vehicles || []) await dbPut("vehicles", v);
      for (const c of data.costs || []) await dbPut("costs", c);
      for (const w of data.werkstatt || []) await dbPut("werkstatt", w);
      await loadAll();
      render();
      alert("Import abgeschlossen.");
    } catch (err) {
      alert("Import fehlgeschlagen: Datei konnte nicht gelesen werden.");
      console.error(err);
    }
  }

  /* ================= RENDER: DASHBOARD ================= */
  function costsForVehicleInYear(vehicleId, year) {
    const c = state.costs.filter(x => x.vehicleId === vehicleId && x.date && x.date.startsWith(String(year)))
      .reduce((s, x) => s + (Number(x.amount) || 0), 0);
    const w = state.werkstatt.filter(x => x.vehicleId === vehicleId && x.date && x.date.startsWith(String(year)))
      .reduce((s, x) => s + (Number(x.kosten) || 0), 0);
    return c + w;
  }

  function renderVehicleCard(v) {
    const meta = TYPE_META[v.type] || TYPE_META.Auto;
    const year = new Date().getFullYear();
    const total = costsForVehicleInYear(v.id, year);
    const tuvStatus = statusFor(v.tuvDate, 60);
    const badge = meta.hasTuv ? plaketteSVG(v.tuvDate, 56) : typeBadge(v.type, 56);
    const statusHtml = meta.hasTuv
      ? statusPill(tuvStatus)
      : `<span class="type-badge-tag" style="color:${meta.color};border:1px solid ${meta.color}55;background:${meta.color}18;">${meta.label}</span>`;
    return `<div class="vcard" tabindex="0" data-action="open-vehicle" data-id="${v.id}">
      ${badge}
      <div style="flex:1;min-width:0;">
        <div class="vcard-name">${esc(v.name || (v.brand + " " + v.model))}</div>
        <div class="vcard-sub">
          <span>${esc(v.brand)} ${esc(v.model)}</span>
          <span class="plate-tag">${esc(v.plate) || "—"}</span>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          ${statusHtml}
          <span style="font-size:11px;color:var(--muted);font-family:var(--font-mono);">${fmtEUR(total)} dieses Jahr</span>
        </div>
      </div>
    </div>`;
  }

  function renderDashboard() {
    const upcoming = [];
    state.vehicles.forEach(v => {
      const meta = TYPE_META[v.type] || TYPE_META.Auto;
      const items = [];
      if (meta.hasTuv) items.push(["TÜV / HU", v.tuvDate]);
      items.push(["Versicherung", v.versFaelligkeit]);
      items.push(["Kfz-Steuer", v.steuerFaelligkeit]);
      items.forEach(([label, date]) => {
        if (date && statusFor(date, 60) !== "none") upcoming.push({ label, date, veh: v });
      });
    });
    upcoming.sort((a, b) => (daysUntil(a.date) ?? 9999) - (daysUntil(b.date) ?? 9999));
    const upcomingTop = upcoming.slice(0, 5);

    let upcomingHtml = "";
    if (upcomingTop.length) {
      upcomingHtml = `<div style="margin-bottom:22px;">
        <div class="section-label">Anstehend</div>
        ${upcomingTop.map(u => {
          const st = statusFor(u.date, 60);
          const color = STATUS_COLOR[st];
          return `<div class="upcoming-item" data-action="open-vehicle" data-id="${u.veh.id}" style="border-left:3px solid ${color};">
            ${icon("alertTriangle", { size: 15, color })}
            <div class="label">${esc(u.label)} · ${esc(u.veh.name || u.veh.brand)}</div>
            <div class="date">${fmtDate(u.date)}</div>
          </div>`;
        }).join("")}
      </div>`;
    }

    const filtered = state.vehicles.filter(v => state.typeFilter === "Alle" || v.type === state.typeFilter);
    const chips = ["Alle", ...TYPE_ORDER].map(t => {
      const active = state.typeFilter === t;
      const color = t === "Alle" ? "#8E9295" : TYPE_META[t].color;
      return `<button class="chip ${active ? "active" : ""}" data-action="set-filter" data-type="${t}"
        style="background:${active ? color + "26" : ""};border-color:${active ? color : ""};">
        ${t === "Alle" ? "Alle" : TYPE_META[t].label}
      </button>`;
    }).join("");

    let listHtml = "";
    if (state.vehicles.length === 0) {
      listHtml = `<div class="empty-state">${icon("car", { size: 32, color: "#8E9295" })}<div style="font-size:14px;margin-top:10px;">Noch kein Fahrzeug angelegt.</div></div>`;
    } else if (filtered.length === 0) {
      listHtml = `<div class="empty-state" style="padding:24px 20px;font-size:13px;">Keine Fahrzeuge in dieser Kategorie.</div>`;
    } else {
      listHtml = filtered.map(renderVehicleCard).join("");
    }

    return `
      ${upcomingHtml}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="section-label" style="margin-bottom:0;">Fahrzeuge (${state.vehicles.length})</div>
      </div>
      ${state.vehicles.length ? `<div class="chip-row">${chips}</div>` : ""}
      <div>${listHtml}</div>
      <button class="btn btn-primary btn-block" data-action="open-add-vehicle">${icon("plus", { size: 16 })} Fahrzeug hinzufügen</button>

      <div class="footer-actions">
        <button class="btn btn-ghost btn-block btn-sm" data-action="export-data">${icon("download", { size: 14 })} Backup exportieren</button>
        <button class="btn btn-ghost btn-block btn-sm" data-action="trigger-import">${icon("upload", { size: 14 })} Backup importieren</button>
      </div>
      <div class="footer-note">Alle Daten liegen ausschließlich lokal in diesem Browser (IndexedDB). Erstelle regelmäßig ein Backup, falls du den Browser wechselst oder Daten löschst.</div>
    `;
  }

  /* ================= RENDER: DETAIL ================= */
  function renderDetail() {
    const v = state.vehicles.find(x => x.id === state.selectedId);
    if (!v) { state.view = "dashboard"; return renderDashboard(); }
    const meta = TYPE_META[v.type] || TYPE_META.Auto;
    const year = new Date().getFullYear();

    const vCosts = state.costs.filter(c => c.vehicleId === v.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const vWerk = state.werkstatt.filter(w => w.vehicleId === v.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const total = vCosts.reduce((s, c) => s + (Number(c.amount) || 0), 0) + vWerk.reduce((s, w) => s + (Number(w.kosten) || 0), 0);
    const totalYear = costsForVehicleInYear(v.id, year);

    const catTotals = {};
    CATS.forEach(c => catTotals[c] = 0);
    vCosts.forEach(c => catTotals[c.category] = (catTotals[c.category] || 0) + (Number(c.amount) || 0));
    catTotals["Werkstatt"] = (catTotals["Werkstatt"] || 0) + vWerk.reduce((s, w) => s + (Number(w.kosten) || 0), 0);
    const byCat = Object.entries(catTotals).filter(([, val]) => val > 0).sort((a, b) => b[1] - a[1]);
    const maxCat = Math.max(1, ...byCat.map(([, v2]) => v2));

    const termine = [];
    if (meta.hasTuv) termine.push({ label: "TÜV / HU", date: v.tuvDate, ic: "shield" });
    termine.push({ label: "Versicherung" + (v.versAnbieter ? " · " + esc(v.versAnbieter) : ""), date: v.versFaelligkeit, ic: "fileText" });
    termine.push({ label: "Kfz-Steuer", date: v.steuerFaelligkeit, ic: "receipt" });
    const termineFiltered = termine.filter(t => t.date).sort((a, b) => (daysUntil(a.date) ?? 9999) - (daysUntil(b.date) ?? 9999));

    const tabs = [
      ["uebersicht", "Übersicht"], ["termine", "Termine"], ["kosten", "Kosten"], ["werkstatt", "Werkstatt"]
    ];
    const tabRow = tabs.map(([id, label]) =>
      `<button class="tab ${state.detailTab === id ? "active" : ""}" data-action="set-tab" data-tab="${id}">${label}</button>`
    ).join("");

    let body = "";
    if (state.detailTab === "uebersicht") {
      body = `
        <div class="stat-row">
          <div class="stat-box"><div class="label">Gesamt</div><div class="value">${fmtEUR(total)}</div></div>
          <div class="stat-box"><div class="label">${year}</div><div class="value">${fmtEUR(totalYear)}</div></div>
        </div>
        ${meta.hasTuv ? `<div class="card" style="display:flex;align-items:center;gap:16px;">
          ${plaketteSVG(v.tuvDate, 64)}
          <div>
            <div class="section-label" style="margin-bottom:2px;">Nächste HU</div>
            <div style="font-family:var(--font-display);font-size:18px;font-weight:700;">${fmtDate(v.tuvDate)}</div>
            ${statusPill(statusFor(v.tuvDate, 60))}
          </div>
        </div>` : ""}
        <div class="section-label">Kosten nach Kategorie</div>
        <div class="card">
          ${byCat.length === 0 ? `<div style="color:var(--muted);font-size:13px;">Noch keine Kosten erfasst.</div>` :
            byCat.map(([cat, val]) => `
              <div class="bar-row">
                <div class="top"><span>${esc(cat)}</span><span class="amt">${fmtEUR(val)}</span></div>
                <div class="bar-track"><div class="bar-fill" style="width:${(val / maxCat) * 100}%;background:${CAT_COLOR[cat] || "#0B4EA2"};"></div></div>
              </div>`).join("")}
        </div>
        <div class="card">
          <div class="section-label">Stammdaten</div>
          <div class="kv-row"><span class="k">FIN</span><span class="v">${esc(v.vin) || "—"}</span></div>
          <div class="kv-row"><span class="k">Erstzulassung</span><span class="v">${fmtDate(v.erstzulassung)}</span></div>
          <div class="kv-row"><span class="k">Kilometerstand</span><span class="v">${v.km ? Number(v.km).toLocaleString("de-DE") + " km" : "—"}</span></div>
        </div>
        <button class="btn btn-danger btn-block" data-action="delete-vehicle" data-id="${v.id}" style="margin-top:20px;">${icon("trash", { size: 15 })} Fahrzeug löschen</button>
      `;
    } else if (state.detailTab === "termine") {
      body = termineFiltered.length === 0
        ? `<div style="color:var(--muted);font-size:13px;margin-bottom:12px;">Keine Termine hinterlegt. Über „Bearbeiten“ ergänzen.</div>`
        : termineFiltered.map(t => {
            const st = statusFor(t.date, 60);
            const color = STATUS_COLOR[st];
            return `<div class="termin-item">
              <div class="termin-icon" style="background:${color}22;color:${color};">${icon(t.ic, { size: 18, color })}</div>
              <div style="flex:1;">
                <div class="termin-label">${t.label}</div>
                <div class="termin-date">${fmtDate(t.date)} · ${daysUntil(t.date)} Tage</div>
              </div>
              ${statusPill(st)}
            </div>`;
          }).join("");
      if (v.versBetrag) body += `<div class="termin-note">Versicherung: ${fmtEUR(v.versBetrag)} / Jahr${v.versVertragsnr ? " · Vertrag " + esc(v.versVertragsnr) : ""}</div>`;
      if (v.steuerBetrag) body += `<div class="termin-note">Kfz-Steuer: ${fmtEUR(v.steuerBetrag)} / Jahr</div>`;
    } else if (state.detailTab === "kosten") {
      body = `<button class="btn btn-primary btn-block" data-action="open-add-cost" style="margin-bottom:14px;">${icon("plus", { size: 16 })} Kosten erfassen</button>`;
      if (vCosts.length === 0) body += `<div style="color:var(--muted);font-size:13px;">Noch keine Einträge.</div>`;
      body += vCosts.map(c => `
        <div class="list-item" data-action="edit-cost" data-id="${c.id}" style="cursor:pointer;">
          <span class="dot" style="background:${CAT_COLOR[c.category] || "#8E9295"};"></span>
          <div class="main">
            <div class="title">${esc(c.category)}${c.note ? " · " + esc(c.note) : ""}</div>
            <div class="sub">${fmtDate(c.date)}</div>
          </div>
          <div class="amt">${fmtEUR(c.amount)}</div>
          <button class="icon-btn" data-action="delete-cost" data-id="${c.id}">${icon("x", { size: 14, color: "#5A5D60" })}</button>
        </div>`).join("");
    } else if (state.detailTab === "werkstatt") {
      body = `<button class="btn btn-primary btn-block" data-action="open-add-werkstatt" style="margin-bottom:14px;">${icon("plus", { size: 16 })} Werkstatt-Eintrag</button>`;
      if (vWerk.length === 0) body += `<div style="color:var(--muted);font-size:13px;">Noch keine Einträge.</div>`;
      body += vWerk.map(w => `
        <div class="werk-item" data-action="edit-werkstatt" data-id="${w.id}" style="cursor:pointer;">
          <div class="top">
            <div class="desc">${esc(w.beschreibung)}</div>
            <button class="icon-btn" data-action="delete-werkstatt" data-id="${w.id}">${icon("x", { size: 14, color: "#5A5D60" })}</button>
          </div>
          <div class="meta">${fmtDate(w.date)}${w.werkstatt ? " · " + esc(w.werkstatt) : ""}</div>
          <div class="amt">${fmtEUR(w.kosten)}</div>
        </div>`).join("");
    }

    return `
      <div class="detail-header">
        <button class="icon-btn" data-action="back" style="color:var(--muted);">${icon("chevronLeft", { size: 22 })}</button>
        ${typeBadge(v.type, 38)}
        <div style="flex:1;">
          <div class="detail-title">${esc(v.name || (v.brand + " " + v.model))}</div>
          <div class="detail-sub">${esc(v.brand)} ${esc(v.model)} · ${esc(v.plate)}</div>
        </div>
        <button class="btn btn-ghost btn-sm" data-action="open-edit-vehicle">Bearbeiten</button>
      </div>
      <div class="tab-row">${tabRow}</div>
      <div>${body}</div>
    `;
  }

  /* ================= RENDER: MODALS / FORMS ================= */
  function fieldInput(opts) {
    return `<div class="field"><label>${opts.label}</label>
      <input type="${opts.type || "text"}" name="${opts.name}" value="${esc(opts.value || "")}"
        placeholder="${esc(opts.placeholder || "")}" ${opts.step ? 'step="' + opts.step + '"' : ""}>
    </div>`;
  }

  function renderVehicleForm(v) {
    v = v || {};
    const meta = TYPE_META[v.type] || TYPE_META.Auto;
    const typeChips = TYPE_ORDER.map(t => {
      const m = TYPE_META[t];
      const active = (v.type || "Auto") === t;
      return `<div class="type-chip ${active ? "active" : ""}" data-action="select-type" data-type="${t}"
        style="${active ? `background:${m.color}26;border-color:${m.color};` : ""}">
        ${typeIcon(t, { size: 18, color: active ? m.color : "#8E9295" })}
        <span>${m.label}</span>
      </div>`;
    }).join("");

    return `
      <form data-form="vehicle">
        <input type="hidden" name="id" value="${v.id || ""}">
        <input type="hidden" name="type" id="type-input" value="${v.type || "Auto"}">
        <div class="field">
          <label>Fahrzeugart</label>
          <div class="type-chip-row">${typeChips}</div>
        </div>
        ${fieldInput({ label: "Name (z. B. Alltagsauto)", name: "name", value: v.name, placeholder: "Familienauto" })}
        <div class="field-row">
          ${fieldInput({ label: "Marke", name: "brand", value: v.brand, placeholder: "VW" })}
          ${fieldInput({ label: "Modell", name: "model", value: v.model, placeholder: "Golf" })}
        </div>
        <div class="field-row">
          ${fieldInput({ label: "Kennzeichen", name: "plate", value: v.plate, placeholder: "B-XX 1234" })}
          ${fieldInput({ label: "Kilometerstand", name: "km", value: v.km, type: "number", placeholder: "82000" })}
        </div>
        ${fieldInput({ label: "FIN / Fahrgestellnummer", name: "vin", value: v.vin, placeholder: "WVW..." })}
        ${fieldInput({ label: "Erstzulassung", name: "erstzulassung", value: v.erstzulassung, type: "date" })}

        <div id="tuv-section" class="form-divider" style="display:${meta.hasTuv ? "block" : "none"};">
          <div class="heading">TÜV / HU</div>
          ${fieldInput({ label: "Nächste HU fällig am", name: "tuvDate", value: v.tuvDate, type: "date" })}
        </div>

        <div class="form-divider">
          <div class="heading">Versicherung</div>
          <div class="field-row">
            ${fieldInput({ label: "Anbieter", name: "versAnbieter", value: v.versAnbieter, placeholder: "HUK24" })}
            ${fieldInput({ label: "Vertragsnr.", name: "versVertragsnr", value: v.versVertragsnr })}
          </div>
          <div class="field-row">
            ${fieldInput({ label: "Jahresbeitrag (€)", name: "versBetrag", value: v.versBetrag, type: "number", step: "0.01" })}
            ${fieldInput({ label: "Fällig / Kündigungsfrist", name: "versFaelligkeit", value: v.versFaelligkeit, type: "date" })}
          </div>
        </div>

        <div class="form-divider">
          <div class="heading">Kfz-Steuer</div>
          <div class="field-row">
            ${fieldInput({ label: "Betrag / Jahr (€)", name: "steuerBetrag", value: v.steuerBetrag, type: "number", step: "0.01" })}
            ${fieldInput({ label: "Nächste Abbuchung", name: "steuerFaelligkeit", value: v.steuerFaelligkeit, type: "date" })}
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    `;
  }

  function renderCostForm(c) {
    c = c || {};
    return `
      <form data-form="cost">
        <input type="hidden" name="id" value="${c.id || ""}">
        ${fieldInput({ label: "Datum", name: "date", value: c.date || todayISO(), type: "date" })}
        <div class="field"><label>Kategorie</label>
          <select name="category">${CATS.map(cat => `<option value="${cat}" ${c.category === cat ? "selected" : ""}>${cat}</option>`).join("")}</select>
        </div>
        ${fieldInput({ label: "Betrag (€)", name: "amount", value: c.amount, type: "number", step: "0.01", placeholder: "45.90" })}
        ${fieldInput({ label: "Notiz (optional)", name: "note", value: c.note, placeholder: "Tankstelle Aral" })}
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Abbrechen</button>
          <button type="submit" class="btn btn-primary">${c.id ? "Speichern" : "Eintragen"}</button>
        </div>
      </form>
    `;
  }

  function renderWerkstattForm(w) {
    w = w || {};
    return `
      <form data-form="werkstatt">
        <input type="hidden" name="id" value="${w.id || ""}">
        ${fieldInput({ label: "Datum", name: "date", value: w.date || todayISO(), type: "date" })}
        ${fieldInput({ label: "Werkstatt", name: "werkstatt", value: w.werkstatt, placeholder: "Meisterwerkstatt Schmidt" })}
        ${fieldInput({ label: "Was wurde gemacht?", name: "beschreibung", value: w.beschreibung, placeholder: "Ölwechsel, Bremsbeläge vorne" })}
        ${fieldInput({ label: "Kosten (€)", name: "kosten", value: w.kosten, type: "number", step: "0.01" })}
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Abbrechen</button>
          <button type="submit" class="btn btn-primary">${w.id ? "Speichern" : "Eintragen"}</button>
        </div>
      </form>
    `;
  }

  function renderModal() {
    if (!state.modal) return "";
    let title = "", content = "", wide = false;
    if (state.modal === "addVehicle") { title = "Fahrzeug hinzufügen"; content = renderVehicleForm(); wide = true; }
    else if (state.modal === "editVehicle") {
      const v = state.vehicles.find(x => x.id === state.selectedId);
      title = "Fahrzeug bearbeiten"; content = renderVehicleForm(v); wide = true;
    } else if (state.modal === "addCost") { title = "Kosten erfassen"; content = renderCostForm(); }
    else if (state.modal === "editCost") {
      const c = state.costs.find(x => x.id === state.editingCostId);
      title = "Kosten bearbeiten"; content = renderCostForm(c);
    } else if (state.modal === "addWerkstatt") { title = "Werkstatt-Eintrag"; content = renderWerkstattForm(); }
    else if (state.modal === "editWerkstatt") {
      const w = state.werkstatt.find(x => x.id === state.editingWerkstattId);
      title = "Werkstatt-Eintrag bearbeiten"; content = renderWerkstattForm(w);
    }

    return `<div class="modal-backdrop" data-action="close-modal">
      <div class="modal-box ${wide ? "wide" : ""}" data-stop>
        <div class="modal-head"><h2>${title}</h2>
          <button class="icon-btn" style="background:var(--surface2);border-radius:8px;" data-action="close-modal">${icon("x", { size: 18 })}</button>
        </div>
        ${content}
      </div>
    </div>`;
  }

  /* ================= MAIN RENDER ================= */
  function render() {
    const app = document.getElementById("app");
    if (state.loading) { app.innerHTML = `<div class="loading-screen">Lade Fahrzeugakte…</div>`; return; }
    const body = state.view === "dashboard" ? renderDashboard() : renderDetail();
    app.innerHTML = `
      <div class="wrap">
        <div class="brand"><div class="brand-mark"><span>D</span></div><div class="brand-title">Fahrzeugakte</div></div>
        ${body}
      </div>
      ${renderModal()}
    `;
  }

  /* ================= EVENT DELEGATION ================= */
  document.addEventListener("click", (e) => {
    // modal backdrop close (click outside box)
    if (e.target.classList && e.target.classList.contains("modal-backdrop")) { closeModal(); return; }

    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    switch (action) {
      case "open-vehicle": openVehicle(el.dataset.id); break;
      case "back": goDashboard(); break;
      case "set-tab": setTab(el.dataset.tab); break;
      case "set-filter": setTypeFilter(el.dataset.type); break;
      case "open-add-vehicle": openModal("addVehicle"); break;
      case "open-edit-vehicle": openModal("editVehicle"); break;
      case "close-modal": closeModal(); break;
      case "delete-vehicle": deleteVehicleConfirm(el.dataset.id); break;
      case "open-add-cost": openModal("addCost"); break;
      case "open-add-werkstatt": openModal("addWerkstatt"); break;
      case "edit-cost": openModal("editCost", el.dataset.id); break;
      case "edit-werkstatt": openModal("editWerkstatt", el.dataset.id); break;
      case "delete-cost": deleteCost(el.dataset.id); break;
      case "delete-werkstatt": deleteWerkstatt(el.dataset.id); break;
      case "export-data": exportData(); break;
      case "trigger-import": document.getElementById("import-file-input").click(); break;
      case "select-type": {
        const type = el.dataset.type;
        const input = document.getElementById("type-input");
        if (input) input.value = type;
        const row = el.parentElement;
        row.querySelectorAll(".type-chip").forEach(c => {
          c.classList.remove("active");
          c.style.background = ""; c.style.borderColor = "";
          const svg = c.querySelector("svg");
          if (svg) svg.setAttribute("stroke", "#8E9295");
        });
        el.classList.add("active");
        const m = TYPE_META[type];
        el.style.background = m.color + "26";
        el.style.borderColor = m.color;
        const svg = el.querySelector("svg");
        if (svg) svg.setAttribute("stroke", m.color);
        const tuvSection = document.getElementById("tuv-section");
        if (tuvSection) tuvSection.style.display = m.hasTuv ? "block" : "none";
        break;
      }
      default: break;
    }
  });

  document.addEventListener("submit", (e) => {
    const form = e.target.closest("form[data-form]");
    if (!form) return;
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form).entries());
    if (form.dataset.form === "vehicle") {
      if (!fd.name && !fd.brand) { alert("Bitte mindestens Name oder Marke angeben."); return; }
      const id = fd.id || null;
      delete fd.id;
      saveVehicle(fd, id);
    } else if (form.dataset.form === "cost") {
      if (!fd.amount) { alert("Bitte einen Betrag angeben."); return; }
      const id = fd.id || null;
      delete fd.id;
      saveCost(fd, id);
    } else if (form.dataset.form === "werkstatt") {
      if (!fd.beschreibung) { alert("Bitte eine Beschreibung angeben."); return; }
      const id = fd.id || null;
      delete fd.id;
      saveWerkstatt(fd, id);
    }
  });

  document.getElementById("import-file-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    importDataFile(file);
    e.target.value = "";
  });

  /* ================= INIT ================= */
  (async function init() {
    try {
      await loadAll();
    } catch (err) {
      console.error("IndexedDB Fehler:", err);
      state.loading = false;
      document.getElementById("app").innerHTML =
        `<div class="loading-screen" style="flex-direction:column;gap:10px;text-align:center;padding:20px;">
          <div>Lokaler Speicher (IndexedDB) konnte nicht geöffnet werden.</div>
          <div style="font-size:12px;">Prüfe, ob dein Browser IndexedDB im privaten Modus blockiert.</div>
        </div>`;
      return;
    }
    render();
  })();
})();
</script>
</body>
</html>
